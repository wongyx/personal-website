name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/index.html'
      - 'website/style.css'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ap-southeast-1 
      
      - name: Deploy to S3
        id: deploy
        run: |
          BUCKET_NAME="${{ vars.S3_BUCKET_NAME }}"
          
          # Deploy files
          aws s3 cp website/index.html s3://${BUCKET_NAME}/index.html --cache-control "max-age=300"
          
          aws s3 cp website/style.css s3://${BUCKET_NAME}/style.css --cache-control "max-age=86400"
          
          
          DISTRIBUTION_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          aws cloudfront create-invalidation --distribution-id ${DISTRIBUTION_ID} --paths "/*"
